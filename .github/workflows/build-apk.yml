name: Build Mobile Harness APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;35.0.0" \
                     "ndk;28.2.13676358" \
                     "cmake;3.22.1"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Online Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleOnlineDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 14
